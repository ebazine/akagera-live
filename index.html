<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1E3A24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Reba: live animal sightings, road conditions, trip planning and GPS navigation for Akagera National Park, Rwanda. Unofficial community guide.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Reba">
<meta property="og:title" content="Reba · Akagera game drive companion">
<meta property="og:description" content="Live animal sightings, road conditions and trip planning, shared by drivers in the park.">
<meta property="og:url" content="https://ebazine.github.io/akagera-live/">
<meta property="og:image" content="https://ebazine.github.io/akagera-live/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-title" content="Reba">
<title>Reba · Akagera</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash" aria-hidden="true"><svg class="mk" width="96" height="105" viewBox="96 80 320 350" aria-hidden="true"><path d="M256 424C256 424 128 306 128 218a128 128 0 1 1 256 0c0 88-128 206-128 206z" fill="#E35F14"/><path fill="#FFF6E0" d="M152 192c-4-14 10-26 30-28 10-12 30-16 46-10 12-10 38-12 52-2 16-6 40-2 50 12 20 2 32 14 28 28-26-8-60-12-100-12-44 0-82 4-106 12z"/><g fill="none" stroke="#FFF6E0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M256 322c0-28-2-52-8-74"/><path d="M248 248c-10-18-26-34-48-52"/><path d="M250 262c12-20 34-40 68-62"/></g><path d="M214 324c16-6 60-6 84 0-14 6-70 6-84 0z" fill="#FFF6E0"/></svg><b>Reba</b><span>Murakaza neza</span><small>Akagera game drive companion</small></div>
<script>try{if(sessionStorage.getItem("rebaSplash"))document.getElementById("splash").remove();else sessionStorage.setItem("rebaSplash","1");}catch(e){}</script>
<div id="app">
  <!-- ===== browse header ===== -->
  <header class="top" id="top">
    <div class="brand">
      <svg class="mk" width="28" height="31" viewBox="96 80 320 350" aria-hidden="true"><path d="M256 424C256 424 128 306 128 218a128 128 0 1 1 256 0c0 88-128 206-128 206z" fill="#E35F14"/><path fill="#FFF6E0" d="M152 192c-4-14 10-26 30-28 10-12 30-16 46-10 12-10 38-12 52-2 16-6 40-2 50 12 20 2 32 14 28 28-26-8-60-12-100-12-44 0-82 4-106 12z"/><g fill="none" stroke="#FFF6E0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M256 322c0-28-2-52-8-74"/><path d="M248 248c-10-18-26-34-48-52"/><path d="M250 262c12-20 34-40 68-62"/></g><path d="M214 324c16-6 60-6 84 0-14 6-70 6-84 0z" fill="#FFF6E0"/></svg>
      <div class="bn"><b>Reba</b><small>Akagera</small></div>
    </div>
    <div class="stat">
      <button class="pill" id="wxPill" type="button" aria-label="Weather and road outlook"><span class="wxi" aria-hidden="true">☁</span><span id="wxText">…</span></button>
      <button class="pill" id="syncPill" type="button" aria-label="Sharing status"><i></i><span>…</span></button>
      <button class="iconbtn me" id="meBtn" type="button" aria-label="Create a trip pass">👤</button>
      <button class="iconbtn" id="setBtn" type="button" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zm8.6 4.9l1.9 1.5-2 3.4-2.3-.8a8 8 0 01-2 1.2L15.8 21h-4l-.4-2.4a8 8 0 01-2-1.2l-2.3.8-2-3.4 1.9-1.5a8 8 0 010-2.3L5.1 9.5l2-3.4 2.3.8a8 8 0 012-1.2L11.8 3h4l.4 2.4a8 8 0 012 1.2l2.3-.8 2 3.4-1.9 1.5a8 8 0 010 2.3z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
  </header>

  <div class="mapwrap" id="mapwrap">
    <div class="tiltbox" id="tiltbox"><canvas id="map" aria-label="Map of Akagera National Park"></canvas></div>
    <canvas class="car3d" id="car3d" aria-hidden="true"></canvas>

    <!-- browse controls -->
    <div class="fabcol" id="fabcol">
      <button class="fab sos" id="sosBtn" type="button" aria-label="Emergency help">SOS</button>
      <button class="fab" id="zin" type="button" aria-label="Zoom in">+</button>
      <button class="fab" id="zout" type="button" aria-label="Zoom out">&minus;</button>
      <button class="fab layers" id="layersBtn" type="button" aria-label="Map layers"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z" fill="currentColor"/><path d="M3 12.5l9 5 9-5M3 16.5l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
      <button class="fab chat" id="chatBtn" type="button" aria-label="Chat">💬<i id="chatBadge" class="fbadge" hidden>0</i></button>
      <button class="fab me" id="followBtn" type="button" aria-label="Show my position"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z" fill="currentColor"/></svg></button>
    </div>
    <div class="bgtoggle" role="group" aria-label="Background"><button type="button" data-bg="map" class="on" aria-pressed="true">Map</button><button type="button" data-bg="sat" aria-pressed="false">Satellite</button></div>
    <div class="banner" id="banner" hidden></div>
    <div class="nearcard" id="nearCard" role="status" aria-live="polite" hidden></div>
    <div class="planpop" id="planPop" hidden></div>
    <div class="plandock" id="planDock" hidden></div>
    <div class="bottom" id="bottomBar">
      <div class="gpsline" id="gpsline">Starting GPS…</div>
      <div class="btns">
        <button class="bigbtn find" id="findBtn" type="button"><span aria-hidden="true">🦁</span>Animals<em class="cnt" id="lifeCount" aria-label="Animals ticked">0/34</em></button>
        <button class="bigbtn report" id="reportBtn" type="button"><svg width="26" height="26" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 3v16M3 11h16" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg>Report</button>
        <button class="bigbtn go" id="goBtn" type="button"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l7 19-7-4-7 4 7-19z" fill="currentColor"/></svg>Go</button>
      </div>
    </div>

    <!-- ===== navigation UI ===== -->
    <div class="nav-top" id="navTop" hidden>
      <div class="man"><canvas id="manIcon" width="120" height="120" aria-hidden="true"></canvas></div>
      <div class="mantext"><div class="mandist" id="manDist">—</div><div class="manname" id="manText">Starting route</div></div>
    </div>
    <div class="nav-then" id="navThen" hidden></div>
    <div class="nav-warn" id="navWarn" hidden></div>
    <div class="nav-bottom" id="navBottom" hidden>
      <button class="navx" id="navEnd" type="button" aria-label="End navigation">&times;</button>
      <div class="eta"><b id="etaTime">--:--</b><span id="etaRest">-- min · -- km</span></div>
      <button class="navbtn" id="navReport" type="button" aria-label="Report">+</button>
      <button class="navbtn" id="navMute" type="button" aria-label="Mute voice">🔊</button>
    </div>
    <div class="prev-bar" id="prevBar" hidden>
      <div class="prev-info"><b id="prevCount">Step 1</b><span id="prevSub"></span></div>
      <div class="prev-btns">
        <button type="button" id="prevClose" class="pb x" aria-label="Close preview">&times;</button>
        <button type="button" id="prevPrev" class="pb" aria-label="Previous step">&#8249;</button>
        <button type="button" id="prevPlay" class="pb play" aria-label="Play or pause">▶</button>
        <button type="button" id="prevNext" class="pb" aria-label="Next step">&#8250;</button>
        <button type="button" id="prevStart" class="pb go">Start</button>
      </div>
    </div>
    <button class="sosmini" id="sosMini" type="button" aria-label="Emergency help">SOS</button>
    <div class="speed" id="speedBox" hidden><b id="speedVal">0</b><span>km/h</span></div>

    <div id="toast" class="toast" role="status" hidden></div>
  </div>

  <!-- ===== bottom sheet ===== -->
  <section id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-h">
      <button class="back" id="sheetBack" type="button" aria-label="Back" hidden>&#8249;</button>
      <h2 id="sheetTitle"></h2>
      <div class="dots" id="sheetDots" aria-hidden="true"></div>
      <button class="x" id="sheetClose" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="sheet-b" id="sheetBody"></div>
  </section>
</div>
<script src="config.js"></script>
<script src="species.js"></script>
<script src="emergency.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
